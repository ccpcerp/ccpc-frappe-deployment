# CCPC NEW dedicated ERPNext Caddy — REVIEW SOURCE ONLY
# Intended future target only after separate on-host guard:
#   /etc/systemd/system/caddy.service.d/ccpc-tls-credentials.conf
# Do NOT stage/start/unmask/enable Caddy or open TCP443 merely by committing.
# Source syntax aligned with systemd v255 LoadCredential documentation.
# Validate with systemd-analyze verify on NEW before later activation.
# Existing protected server leaf key remains root:root 0600.
# systemd reads source as manager, grants service-private runtime credential.
# Never put the Root CA SIGNING private key on the server.
# Expected reviewed Caddyfile directive:
#   tls {$CCPC_TLS_FULLCHAIN_FILE} {$CCPC_TLS_PRIVATE_KEY_FILE}
[Service]
LoadCredential=ccpc_tls_key:/etc/ccpc-https/ccpcerp.internal.key
Environment="CCPC_TLS_FULLCHAIN_FILE=/etc/caddy/ccpc-https/ccpcerp.internal.50yr.crt.pem"
Environment="CCPC_TLS_PRIVATE_KEY_FILE=%d/ccpc_tls_key"
