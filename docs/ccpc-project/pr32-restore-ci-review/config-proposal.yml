jobs:
  integration2-backup-restore-isolated:
    docker:
      - image: cimg/python:3.14-node
      - image: mariadb:11.8
        environment:
          MARIADB_ROOT_PASSWORD: ccpc-restore-disposable-db-only
      - image: redis:7-alpine
        command: ["redis-server", "--port", "13000"]
      - image: redis:7-alpine
        command: ["redis-server", "--port", "11000"]
    resource_class: large
    environment:
      TEST_SITE: ci-ccpc-pr32-restore.localhost
      CI_DB_HOST: "127.0.0.1"
      CI_DB_NAME: ci_pr32_restore_20261030
      CCPC_ALLOW_INTEGRATION2_RESTORE: approved-only
    steps:
      - checkout
      - run:
          name: Fail closed on wrong project, branch, SHA, site or pending egress consent
          command: |
            set -euo pipefail
            # Proposed final location: .circleci/pr32_restore_guard.py
            python .circleci/pr32_restore_guard.py
      - run:
          name: NOT ACTIVATED — no network transfer, decrypt or database restore
          command: |
            echo "REVIEW-ONLY: restore operation intentionally blocked"
            exit 86

# Add beneath workflows, only after independent CircleCI policy and trigger review:
workflows:
  opt-in-integration2-backup-restore:
    when: << pipeline.parameters.run_integration2_backup_restore >>
    jobs:
      - integration2-restore-manual-approval:
          type: approval
          filters:
            branches:
              only: review/pr32-integration2-isolated-restore-2026-10-30
      - integration2-backup-restore-isolated:
          requires:
            - integration2-restore-manual-approval
          filters:
            branches:
              only: review/pr32-integration2-isolated-restore-2026-10-30
