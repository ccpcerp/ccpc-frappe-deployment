# CCPC Codex HTTPS-CONNECT only; SECURITY REVIEW ONLY (not approved to run).
# Listener binds ONLY to proxy_clients static address, not the outgoing bridge.
# Any IPAM change must be applied here and in Compose + validator/tests.
# Squid cannot replace host firewall, DNS-rebinding and egress negative tests.
http_port 172.30.250.3:3128
visible_hostname ccpc-codex-dev-proxy
cache deny all
access_log stdio:/dev/stdout
cache_store_log none

# Only the agent on the internal proxy_clients bridge can submit requests.
# This is network-source filtering, not cryptographic client identity.
acl codex_agent src 172.30.250.2/32
acl CONNECT method CONNECT
acl HTTPS port 443
# Explicit special/private/reserved destination exclusions, IPv4 and IPv6.
# Never substitute a broad deny list for host-enforced egress policies.
acl prohibited dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 2001:db8::/32
# Provisional allowlist: independently review needed auth and package hosts.
acl approved dstdomain .openai.com .chatgpt.com .oaistatic.com .oaiusercontent.com .github.com .githubusercontent.com .githubassets.com .npmjs.org .pypi.org .pythonhosted.org

http_access deny !codex_agent
http_access deny !CONNECT
http_access deny !HTTPS
http_access deny prohibited
http_access allow codex_agent CONNECT HTTPS approved
http_access deny all
